[package]
name = "hh-clicker-launcher"
version = "3.1.0"
publish = false
edition = "2021"
rust-version = "1.88"
description = "HH Clicker Launcher for Windows (Rust portable)"
repository = "https://github.com/hh-clicker/launcher-rust"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
eframe = { version = "=0.31.1", default-features = false, features = ["glow"] }
memmap2 = "=0.9.12"
resvg = { version = "=0.37.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.16", features = ["v4", "serde"] }
ureq = { version = "=2.12.1", features = ["json"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Memory"] }

[build-dependencies]
winresource = "0.1"
epaint_default_fonts = "=0.31.1"

[patch.crates-io]
epaint = { path = "vendor/epaint" }

[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
strip = "symbols"
